; Fast Travel Time Info - settings
; Lines starting with ; are comments. 1 = on, 0 = off.
; Changes made here take effect the next time you start the game.
; With SKSE Menu Framework installed you can also change these in-game
; (Fast Travel Time Info > Settings); the menu saves its changes back to this file.

[General]
; Master switch.
bEnabled = 1

; 1 = 16:45, 0 = 4:45 PM
bUse24HourClock = 1

; Add the calendar date to the arrival time, e.g. "Tirdas, 16:45, 18th of Last Seed".
bShowArrivalDate = 1

; Also show the straight-line distance (metres / kilometres).
bShowDistance = 0

; Spacing between the lines of the map flyout (location name and the rows below it),
; in percent of the game's own spacing. 100 = unchanged, lower = tighter (e.g. 80).
; Range 50 to 150.
iLineSpacing = 100

; Translucent dark panel behind the flyout text, for easier reading on bright parts of the map.
bShowBackground = 0

; Opacity of that panel in percent: 0 = invisible, 100 = solid black.
iBackgroundOpacity = 60

; Corner rounding of that panel in pixels: 0 = square corners, up to 12.
iBackgroundCornerRadius = 3

; 1 = only show estimates on markers you can actually fast travel to.
; 0 = also show them on undiscovered locations.
bOnlyFastTravelMarkers = 1

; Learn the game's real travel speed from your own fast travels (recommended).
; Learned values are kept in Documents\My Games\Skyrim Special Edition\SKSE\
; FastTravelTimeInfo_Calibration.txt - delete that file to start over.
bAutoCalibrate = 1

; Travel speed (game units per real-time second) used until the first calibration.
; The tooltip shows a leading "~" while this starting guess is in use.
fSeedSpeed = 80.0

[Text]
; Labels shown in the map flyout. Put text in double quotes to keep spaces.
sTravelLabel = "Travel time"
sArrivalLabel = "Arrival"
sDistanceLabel = "Distance"
sApproxPrefix = "~"
sDayUnit = "d"
sHourUnit = "h"
sMinuteUnit = "min"
sMonthJoiner = " of "
